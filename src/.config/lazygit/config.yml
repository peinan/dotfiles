git:
  diffRenderers:
    - colorArg: never
      command: delta --paging=never --dark --no-gitconfig --line-numbers --syntax-theme=Coldark-Dark
      useConfig: false
customCommands:
  - key: "c"
    context: "files"
    description: "Generate commit message (short) with aicommit2"
    prompts:
      - type: "menuFromCommand"
        title: "Select commit message"
        key: "Commit"
        command: "aicommit2 --output json"
        filter: '"subject":"(?P<subject>[^"]+)","body":"(?P<body>[^"]*)"'
        valueFormat: '{{ .subject }}<SEP>{{ .body }}'
        labelFormat: '{{ .subject }}'
    output: "terminal"
    command: bash -c 'MSG="{{ .Form.Commit }}" && SUBJ="${MSG%%<SEP>*}" && BODY="${MSG#*<SEP>}" && git commit -e -m "$SUBJ" ${BODY:+-m "$BODY"}'
  - key: "C"
    context: "files"
    description: "Generate commit message (long) with aicommit2"
    output: "terminal"
    command: "/Users/s02836/ghq/github.com/peinan/dotfiles/src/.config/lazygit/scripts/aicommit_fzf.sh"
