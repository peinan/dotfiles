# Global mise config. `mise use -g` writes to this file, so expect it to be
# reformatted by mise itself. Project-level `[env]` / `[tasks]` / `[hooks]`
# live in misc/mise/mise.toml instead.

[tools]
node = "25.3.0"
deno = "latest"
pnpm = "latest"

"npm:@antfu/ni" = "latest"
"npm:@google/gemini-cli" = "latest"
"npm:agent-browser" = "latest"
"npm:aicommit2" = "latest"

# Language Servers
"npm:vscode-langservers-extracted" = "latest"
"npm:yaml-language-server" = "latest"

rust = "1.96.1"
just = "latest"
bun = "1.3.14"
"cargo:cargo-nextest" = "latest"
