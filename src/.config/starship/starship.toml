# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Inserts a blank line between shell prompts
add_newline = true

format = """
$hostname\
$username\
$character
"""

right_format = """
$python\
$rust\
$cmd_duration\
$directory
"""

[character]
error_symbol = ' [](red) '
success_symbol = ' [](green) '

[os]
disabled = false
format = "$symbol"

[os.symbols]
Macos       = "[ ](fg:green)"
Arch        = "[ ](fg:bright-blue)"
Debian      = "[ ](fg:red)"
EndeavourOS = "[ ](fg:purple)"
Fedora      = "[ ](fg:blue)"
NixOS       = "[ ](fg:bright-white)"
openSUSE    = "[ ](fg:green)"
SUSE        = "[ ](fg:green)"

[hostname]
ssh_symbol = " "
format = "[$ssh_symbol$hostname]($style): "

[username]
format = '\([$user]($style)\) '

[directory]
truncation_length = 3
repo_root_style = 'bold #60728a'
format = " [$path]($style)[$read_only]($read_only_style)"
style = "dimmed #60728a"

[time]
disabled = false
format = " [$time](dimmed #60728a)"

[cmd_duration]
min_time = 2_000
format = "[  $duration]($style)"
style = "dimmed #60728a"

[git_branch]
symbol = " "
format = ' [$symbol$branch(:$remote_branch)](dimmed #60728a)'

[git_status]
format = '([$all_status$ahead_behind](dimmed #60728a))'

[package]

[python]
symbol = " "
style = "dimmed #60728a"
format = ' [${symbol}${pyenv_prefix}(${version})(\($virtualenv\))]($style)'

[rust]
symbol = " "
style = "dimmed #60728a"
format = ' [$symbol($version)]($style)'
