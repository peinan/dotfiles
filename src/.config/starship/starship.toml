# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Inserts a blank line between shell prompts
add_newline = true

format = """
$hostname\
$username\
$character
"""

right_format = """
$python\
$rust\
$cmd_duration\
${custom.gituser}\
${custom.gituser_mismatch}\
$directory
"""

[character]
error_symbol = ' [](red) '
success_symbol = ' [](green) '

[os]
disabled = false
format = "$symbol"

[os.symbols]
Macos       = "[ ](fg:green)"
Arch        = "[ ](fg:bright-blue)"
Debian      = "[ ](fg:red)"
EndeavourOS = "[ ](fg:purple)"
Fedora      = "[ ](fg:blue)"
NixOS       = "[ ](fg:bright-white)"
openSUSE    = "[ ](fg:green)"
SUSE        = "[ ](fg:green)"

[hostname]
ssh_symbol = " "
format = "[$ssh_symbol$hostname]($style): "

[username]
format = '\([$user]($style)\) '

[custom.gituser]
command = "git config user.name 2>/dev/null"
when = '''
git rev-parse --is-inside-work-tree >/dev/null 2>&1 || exit 1
g=$(git config user.name 2>/dev/null); [ -n "$g" ] || exit 1
gh=$(awk '/^[[:space:]]+user:[[:space:]]/{print $2; exit}' "$HOME/.config/gh/hosts.yml" 2>/dev/null)
[ -z "$gh" ] || [ "$g" = "$gh" ]
'''
format = "[$output]($style) [@]($style)"
style = "dimmed #60728a"

[custom.gituser_mismatch]
command = "git config user.name 2>/dev/null"
when = '''
git rev-parse --is-inside-work-tree >/dev/null 2>&1 || exit 1
g=$(git config user.name 2>/dev/null); [ -n "$g" ] || exit 1
gh=$(awk '/^[[:space:]]+user:[[:space:]]/{print $2; exit}' "$HOME/.config/gh/hosts.yml" 2>/dev/null)
[ -n "$gh" ] && [ "$g" != "$gh" ]
'''
format = "[$output]($style) [@](dimmed #60728a)"
style = "red"

[directory]
truncation_length = 3
repo_root_style = 'bold #60728a'
repo_root_format = " [$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style)"
format = " [$path]($style)[$read_only]($read_only_style)"
style = "dimmed #60728a"

[time]
disabled = false
format = " [$time](dimmed #60728a)"

[cmd_duration]
min_time = 2_000
format = "[  $duration]($style)"
style = "dimmed #60728a"

[git_branch]
symbol = " "
format = ' [$symbol$branch(:$remote_branch)](dimmed #60728a)'

[git_status]
format = '([$all_status$ahead_behind](dimmed #60728a))'

[package]

[python]
symbol = " "
style = "dimmed #60728a"
format = ' [${symbol}${pyenv_prefix}(${version})(\($virtualenv\))]($style)'

[rust]
symbol = " "
style = "dimmed #60728a"
format = ' [$symbol($version)]($style)'
